id: forwarder-retired-indexer
title: An Ashburn app server stopped sending data
summary: >-
  ash-app-0001 has a local outputs.conf (system/local) that overrides the deployed output group with
  idx07.corp.example:9997, an indexer that was decommissioned. The forwarder cannot connect, its output
  queue fills, and nothing from it is indexed.
topics: [forwarders, outputs]
difficulty: easy
trigger: { onDemand: true }
ticket:
  requester: Jordan, Payments Team
  persona: impatient
  urgency: high
  text: >-
    ash-app-0001 has no data in Splunk since this morning, but the service on it is fine and other
    Ashburn app servers report normally. A contractor did some "cleanup" on the box yesterday.
changes:
  - host: ash-app-0001
    path: /opt/splunkforwarder/etc/system/local/outputs.conf
    stanza: 'tcpout:ash_indexers'
    set: { server: 'idx07.corp.example:9997' }
    apply: restart
clues:
  [
    'ash-app-0001: /opt/splunkforwarder/var/log/splunk/splunkd.log TcpOutputProc',
    'splunk btool outputs list --debug on the forwarder',
    'Monitoring Console > Forwarders',
  ]
redHerrings:
  - host: ash-app-0001
    file: messages
    component: kernel
    message: 'TCP: request_sock_TCP: Possible SYN flooding on port 8443. Sending cookies.  Check SNMP counters.'
    everyMinutes: 9
  - host: ds01
    file: splunkd
    level: WARN
    component: PubSubSvr
    message: 'Subscription channel=deploymentServer/phoneHome/default/ash-app-0001 timed out waiting for reply'
    everyMinutes: 12
fixChecks:
  forwarderDelivering: { host: ash-app-0001 }
recovery: { seconds: 30 }
